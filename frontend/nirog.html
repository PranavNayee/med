<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nirog — Your family's health, one tap away</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================== DESIGN TOKENS ============================== */
:root{
  --teal-900:#06352e; --teal-800:#0a4d42; --teal-700:#0e7c6b; --teal-600:#13a08a;
  --teal-500:#19c2a6; --teal-400:#3dd0b8; --teal-300:#7fe0cf; --teal-200:#aeece1; --teal-100:#d6f4ee; --teal-50:#eefbf8;
  --mint:#e9f6f2; --mint-2:#f2fbf9;
  --coral:#ff6b5a; --coral-dark:#f24e3b; --coral-soft:#fff0ed;
  --amber:#f5a623; --amber-soft:#fff6e6;
  --green:#16a34a; --green-dark:#0a7d54; --green-soft:#e8f8ee;
  --blue:#3b82f6; --blue-soft:#eaf1ff;
  --violet:#7c5cff; --violet-soft:#f0ecff;
  --rose:#f43f6e; --rose-soft:#ffeaf0;
  --ink:#0f2a26; --ink-2:#34514b; --muted:#6a857f; --faint:#9bb0aa;
  --line:#e6efec; --line-2:#d8e7e2;
  --bg:#f5f9f7; --card:#ffffff;
  --shadow-sm:0 1px 2px rgba(8,60,52,.06), 0 1px 3px rgba(8,60,52,.05);
  --shadow:0 6px 22px rgba(8,60,52,.08), 0 2px 6px rgba(8,60,52,.05);
  --shadow-lg:0 18px 50px rgba(8,60,52,.16), 0 6px 16px rgba(8,60,52,.08);
  --r-sm:10px; --r:16px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
  --display:'Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --sb:280px; --maxw:1320px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--teal-300);color:var(--teal-900)}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfe2dc;border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b6d4cc}

/* ============================== LAYOUT SHELL ============================== */
#root{min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sb);flex:0 0 var(--sb);background:var(--card);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;
}
.sb-brand{display:flex;align-items:center;gap:11px;padding:22px 22px 14px}
.sb-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,var(--teal-600),var(--teal-800));display:grid;place-items:center;box-shadow:0 6px 16px rgba(14,124,107,.35)}
.sb-name{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);letter-spacing:-.04em}
.sb-name b{color:var(--teal-700)}
.sb-tag{font-size:11px;color:var(--muted);margin-top:1px;font-weight:500}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 12px 12px}
.sb-group-label{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:16px 12px 7px}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:13px;color:var(--ink-2);font-weight:600;font-size:14.5px;position:relative;transition:.16s;margin-bottom:2px}
.nav-item:hover{background:var(--mint);color:var(--teal-800)}
.nav-item.active{background:linear-gradient(100deg,var(--teal-700),var(--teal-600));color:#fff;box-shadow:0 8px 18px rgba(14,124,107,.28)}
.nav-item.active .ni-ic{color:#fff}
.ni-ic{width:20px;height:20px;flex:0 0 20px;color:var(--teal-600);transition:.16s}
.nav-item:hover .ni-ic{color:var(--teal-700)}
.ni-badge{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.nav-item.active .ni-badge{background:rgba(255,255,255,.25)}
.sb-foot{padding:12px;border-top:1px solid var(--line)}
.sb-emerg{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;background:var(--coral-soft);color:var(--coral-dark);font-weight:700;font-size:14px;width:100%;transition:.16s}
.sb-emerg:hover{background:#ffe2dc}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:35;background:rgba(245,249,247,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:16px}
.tb-mobtitle{display:none}
.searchbar{flex:1;max-width:520px;display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:11px 18px;transition:.18s;box-shadow:var(--shadow-sm)}
.searchbar:focus-within{border-color:var(--teal-500);box-shadow:0 0 0 4px var(--teal-50)}
.searchbar input{border:none;outline:none;background:none;font-size:14.5px;width:100%;color:var(--ink)}
.searchbar input::placeholder{color:var(--faint)}
.tb-loc{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--r-pill);background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow-sm);white-space:nowrap}
.tb-loc b{color:var(--teal-700)}
.tb-spacer{flex:1}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-2);transition:.16s;box-shadow:var(--shadow-sm)}
.icon-btn:hover{border-color:var(--teal-300);color:var(--teal-700);transform:translateY(-1px)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--card)}
.icon-btn .cnt{position:absolute;top:-6px;right:-6px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.tb-avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--violet),var(--blue));display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;font-family:var(--display);box-shadow:var(--shadow-sm);cursor:pointer}

.content{flex:1;padding:26px;max-width:var(--maxw);width:100%;margin:0 auto}
.page-enter{animation:pageIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================== TYPOGRAPHY HELPERS ============================== */
.h-xl{font-size:30px;font-weight:800;letter-spacing:-.035em}
.h-lg{font-size:23px;font-weight:800;letter-spacing:-.03em}
.h-md{font-size:18px;font-weight:700;letter-spacing:-.02em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-600)}
.sub{color:var(--muted);font-size:14px;line-height:1.5}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px}
.section-head .link{color:var(--teal-700);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:4px}
.section-head .link:hover{gap:7px;transition:.16s}

/* ============================== CARDS / BUTTONS ============================== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;padding:12px 20px;border-radius:var(--r-pill);transition:.16s;white-space:nowrap;font-family:var(--display);letter-spacing:-.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(100deg,var(--teal-700),var(--teal-600));color:#fff;box-shadow:0 8px 20px rgba(14,124,107,.3)}
.btn-primary:hover{box-shadow:0 12px 26px rgba(14,124,107,.4);transform:translateY(-1px)}
.btn-coral{background:linear-gradient(100deg,var(--coral),var(--coral-dark));color:#fff;box-shadow:0 8px 20px rgba(255,107,90,.32)}
.btn-coral:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(255,107,90,.42)}
.btn-ghost{background:var(--mint);color:var(--teal-800)}
.btn-ghost:hover{background:var(--teal-100)}
.btn-outline{background:var(--card);border:1.5px solid var(--line-2);color:var(--ink-2)}
.btn-outline:hover{border-color:var(--teal-400);color:var(--teal-700)}
.btn-sm{padding:8px 15px;font-size:13px}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-pill);background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2);transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--teal-300)}
.chip.on{background:var(--teal-700);color:#fff;border-color:var(--teal-700)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700}
.tag-green{background:var(--green-soft);color:var(--green)}
.tag-coral{background:var(--coral-soft);color:var(--coral-dark)}
.tag-blue{background:var(--blue-soft);color:var(--blue)}
.tag-amber{background:var(--amber-soft);color:#c87f00}
.tag-teal{background:var(--teal-50);color:var(--teal-700)}
.tag-violet{background:var(--violet-soft);color:var(--violet)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ============================== GRID UTILS ============================== */
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.center{align-items:center}
.scroll-x{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{height:0}
.scroll-x>*{scroll-snap-align:start;flex:0 0 auto}

/* ============================== HOME HERO ============================== */
.hero{background:linear-gradient(125deg,var(--teal-800),var(--teal-700) 55%,var(--teal-600));border-radius:var(--r-xl);padding:28px 30px;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 44px rgba(14,124,107,.3)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.hero::before{content:"";position:absolute;right:90px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(127,224,207,.22),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:27px;font-weight:800;margin-bottom:7px}
.hero p{color:rgba(255,255,255,.82);font-size:14.5px;max-width:430px;line-height:1.55}
.hero-stats{display:flex;gap:26px;margin-top:20px}
.hero-stat .n{font-family:var(--display);font-size:22px;font-weight:800}
.hero-stat .l{font-size:12px;color:rgba(255,255,255,.7);font-weight:500}

/* health ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{position:relative;width:148px;height:148px}
.ring svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .score{font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.ring-center .lbl{font-size:11px;color:rgba(255,255,255,.78);font-weight:600;letter-spacing:.04em;margin-top:2px}

/* quick actions */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:13px;transition:.18s;text-align:left;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.qa:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
.qa-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff}
.qa-t{font-weight:700;font-size:15.5px;font-family:var(--display);letter-spacing:-.02em}
.qa-d{font-size:12.5px;color:var(--muted);line-height:1.4}
.qa-arrow{position:absolute;right:16px;top:18px;color:var(--faint);transition:.18s}
.qa:hover .qa-arrow{color:var(--teal-600);transform:translate(3px,-3px)}

/* family switcher */
.fam-row{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px}
.fam{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px;min-width:64px;cursor:pointer}
.fam-av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--display);font-size:18px;border:3px solid transparent;transition:.16s}
.fam.on .fam-av{border-color:var(--teal-500);box-shadow:0 0 0 3px var(--teal-50)}
.fam-name{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.fam.on .fam-name{color:var(--teal-700)}
.fam-add .fam-av{background:var(--mint);color:var(--teal-600);border:2px dashed var(--teal-300)}

/* ============================== PHARMACY ============================== */
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.med-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.18s;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.med-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--teal-100)}
.med-thumb{height:120px;background:linear-gradient(135deg,var(--mint),var(--teal-50));display:grid;place-items:center;position:relative}
.med-thumb .pill-ic{width:52px;height:52px;color:var(--teal-600)}
.med-rx{position:absolute;top:10px;left:10px}
.med-disc{position:absolute;top:10px;right:10px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px}
.med-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.med-name{font-weight:700;font-size:15px;font-family:var(--display);line-height:1.25}
.med-salt{font-size:12px;color:var(--muted)}
.med-pack{font-size:11.5px;color:var(--faint)}
.med-price{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.med-price .now{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink)}
.med-price .was{font-size:13px;color:var(--faint);text-decoration:line-through}
.med-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--teal-200,#bfe8df);border-radius:var(--r-pill);overflow:hidden;background:var(--teal-50)}
.stepper button{width:34px;height:34px;display:grid;place-items:center;color:var(--teal-700);font-weight:800;font-size:18px}
.stepper button:hover{background:var(--teal-100)}
.stepper .qn{min-width:30px;text-align:center;font-weight:700;color:var(--teal-800);font-size:14px}

/* medicine detail */
.md-head{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
.md-vis{height:200px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--mint),var(--teal-50));display:grid;place-items:center;border:1px solid var(--line)}
.md-vis svg{width:80px;height:80px;color:var(--teal-600)}
.fact{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:none}
.fact-ic{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:grid;place-items:center;background:var(--mint);color:var(--teal-700)}
.fact-t{font-weight:700;font-size:13.5px;margin-bottom:2px}
.fact-d{font-size:13px;color:var(--muted);line-height:1.5}
.subst-row{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r);transition:.15s;background:var(--card)}
.subst-row:hover{border-color:var(--teal-300);box-shadow:var(--shadow-sm)}
.subst-row.best{border-color:var(--green);background:var(--green-soft)}
.subst-ic{width:46px;height:46px;border-radius:12px;flex:0 0 46px;display:grid;place-items:center;background:#fff;color:var(--teal-600);border:1px solid var(--line)}
.save-pill{background:var(--green);color:#fff;font-weight:800;font-size:12px;padding:5px 11px;border-radius:var(--r-pill)}

/* ============================== DOCTORS ============================== */
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:13px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:.16s;text-align:center;box-shadow:var(--shadow-sm)}
.spec:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--teal-100)}
.spec-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center}
.spec-n{font-weight:700;font-size:13px;font-family:var(--display)}
.spec-c{font-size:11px;color:var(--muted)}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;gap:16px;transition:.16s;box-shadow:var(--shadow-sm)}
.doc-card:hover{box-shadow:var(--shadow);border-color:var(--teal-100)}
.doc-av{width:72px;height:72px;border-radius:18px;flex:0 0 72px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;font-family:var(--display);position:relative}
.doc-on{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid var(--card)}
.doc-meta{flex:1;min-width:0}
.doc-name{font-weight:700;font-size:16.5px;font-family:var(--display)}
.doc-spec{color:var(--teal-700);font-weight:600;font-size:13px}
.doc-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.doc-stats{display:flex;gap:16px;margin-top:11px;flex-wrap:wrap}
.doc-stat{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.star{color:var(--amber)}
.slot{padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2);transition:.14s}
.slot:hover{border-color:var(--teal-400);color:var(--teal-700)}
.slot.on{background:var(--teal-700);color:#fff;border-color:var(--teal-700)}

/* consult chat */
.chat-wrap{display:flex;flex-direction:column;height:560px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.chat-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;background:var(--mint-2)}
.chat-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(var(--bg),var(--bg))}
.bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5}
.bubble.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start;box-shadow:var(--shadow-sm)}
.bubble.me{background:linear-gradient(100deg,var(--teal-700),var(--teal-600));color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bubble.ai{background:var(--violet-soft);border:1px solid #e2daff;border-bottom-left-radius:5px;align-self:flex-start}
.chat-input{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--card)}
.chat-input input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-pill);padding:11px 18px;outline:none;font-size:14px}
.chat-input input:focus{border-color:var(--teal-400)}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--teal-400);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ============================== LABS ============================== */
.lab-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;transition:.16s;box-shadow:var(--shadow-sm)}

/* ============================== RECORDS TIMELINE ============================== */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line-2)}

.tl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow-sm);transition:.15s}
.tl-card:hover{box-shadow:var(--shadow);border-color:var(--teal-100)}

/* ============================== STAT TILES ============================== */
.stat-tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.stat-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:13px}
.stat-n{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.03em}

/* offers */
.offer{min-width:300px;border-radius:var(--r-lg);padding:22px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:140px}

.offer p{font-size:13px;opacity:.92;margin-top:4px}
.offer .code{margin-top:14px;align-self:flex-start;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);padding:6px 13px;border-radius:9px;font-weight:700;font-size:13px;letter-spacing:.05em;border:1px dashed rgba(255,255,255,.5)}

/* ============================== CART / DRAWER ============================== */
.scrim{position:fixed;inset:0;background:rgba(8,35,30,.42);backdrop-filter:blur(3px);z-index:90;animation:fade .25s}

.drawer{position:fixed;top:0;right:0;height:100vh;width:430px;max-width:92vw;background:var(--bg);z-index:100;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--card)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-foot{padding:18px 22px;border-top:1px solid var(--line);background:var(--card)}
.cart-item{display:flex;gap:13px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px}
.cart-thumb{width:54px;height:54px;border-radius:12px;background:var(--mint);display:grid;place-items:center;flex:0 0 54px;color:var(--teal-600)}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px}
.modal-card{background:var(--card);border-radius:var(--r-xl);width:100%;max-width:480px;box-shadow:var(--shadow-lg);animation:popIn .3s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}

/* emergency */
.sos-btn{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,var(--coral) 55%,var(--coral-dark));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:24px;box-shadow:0 18px 50px rgba(242,78,59,.5);position:relative}
.sos-btn::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--coral);opacity:.5;animation:sosPulse 2s infinite}
@keyframes sosPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.25);opacity:0}}

/* toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{background:var(--teal-900);color:#fff;padding:13px 20px;border-radius:var(--r-pill);font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* progress / misc */
.pbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal-600),var(--teal-500))}
.skel{background:linear-gradient(90deg,#eef4f2,#f7fbf9,#eef4f2);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Prescription reader */

<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.js"></script>
<script src="config.js"></script>
<script>
/* ============================================================================
   NIROG — Healthcare Super App  ·  single-file prototype
   React 18 + htm (no build step).  All data is mock/demo.
   ============================================================================ */
const {useState,useEffect,useRef,useMemo,createElement} = React;
const html = htm.bind(createElement);
const $ = (id)=>document.getElementById(id);

/* ============================== API CLIENT ==============================
   All data now comes from the Nirog backend. Nothing clinical is hard-coded
   in the browser any more.
   ====================================================================== */
const API_BASE = (window.NIROG_API_BASE || 'http://127.0.0.1:5000') + '/api';
const TOKEN_KEY = 'nirog_token';
let AUTH_TOKEN = (()=>{ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } })();
function setAuthToken(token){
  AUTH_TOKEN = token || null;
  try{ token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); }catch(e){}
}

async function api(path, options={}){
  const headers = Object.assign({}, options.headers || {});
  if(!(options.body instanceof FormData)) headers['Content-Type']='application/json';
  if(AUTH_TOKEN) headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
  const res = await fetch(API_BASE + path, Object.assign({}, options, {
    headers,
    body: options.body instanceof FormData ? options.body
        : (options.body ? JSON.stringify(options.body) : undefined),
  }));
  let payload = null;
  try { payload = await res.json(); } catch(e) { payload = null; }
  if(res.status===401 && AUTH_TOKEN && !path.startsWith('/auth/')){
    // Expired or revoked session: drop it and let the app fall back to guest.
    setAuthToken(null);
    window.dispatchEvent(new Event('nirog-logout'));
  }
  if(!res.ok){
    const err = new Error((payload && payload.message) || (payload && payload.error) || ('HTTP '+res.status));
    err.status = res.status; err.code = payload && payload.error; err.payload = payload;
    throw err;
  }
  return payload;
}

/* Accent colours are presentation only, so they stay client-side and are
   assigned deterministically rather than stored per product. */
const ACCENTS = ['teal','coral','blue','green','rose','violet','amber'];
const accentFor = (key='') => {
  let h = 0; for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
  return ACCENTS[h % ACCENTS.length];
};

/* Mutable stores, filled by boot(). Components read these exactly as they
   read the old constants. */
let MEDS=[], SPECS=[], DOCTORS=[], LABS=[], PACKAGES=[], RECORDS=[],
    TRENDS={}, FAMILY=[], REMINDERS=[], ORDERS=[];

const OFFERS = [
  {t:'Flat 25% off medicines', d:'On your first order above \u20b9499', code:'NIROG25', bg:'linear-gradient(120deg,#0e7c6b,#13a08a)'},
  {t:'Free doctor consult', d:'First video consult on us', code:'FREEDOC', bg:'linear-gradient(120deg,#ff6b5a,#f24e3b)'},
  {t:'Full body test \u20b91499', d:'92 parameters \u00b7 Home sample', code:'FULLBODY', bg:'linear-gradient(120deg,#7c5cff,#5a3ff0)'},
];

const decorate = (p) => Object.assign({}, p, {color: accentFor(p.id||p.name||'')});

const TREND_META = {
  hba1c:{label:'HbA1c', good:'<5.7', color:'amber', dir:'down'},
  bp_sys:{label:'Blood Pressure (Systolic)', good:'<120', color:'rose', dir:'down'},
  weight:{label:'Weight', good:'68\u201372', color:'teal', dir:'down'},
};

let USER = null;       // {name, first_name, mobile} once logged in
let SERVER_CART = null; // last /cart payload

async function boot(){
  /* Guests can browse. A saved session is restored if it is still valid. */
  if(AUTH_TOKEN){
    try{ USER = await api('/me'); }
    catch(e){ setAuthToken(null); USER = null; }
  }

  const [products, specs, doctors, labs, me] = await Promise.all([
    api('/catalog/products?size=48'),
    api('/specialties'),
    api('/doctors'),
    api('/lab-tests'),
    USER ? Promise.resolve(USER) : Promise.resolve({members:[]}),
  ]);

  MEDS = (products.items||[]).map(decorate);
  SPECS = (specs.items||[]).map(s=>Object.assign({}, s, {color: s.color||accentFor(s.id)}));
  DOCTORS = (doctors.items||[]).map(decorate);

  const allLabs = (labs.items||[]).map(decorate);
  LABS = allLabs.filter(l=>!l.package);
  PACKAGES = allLabs.filter(l=>l.package).map(p=>Object.assign({},p,{tests:p.params}));


  FAMILY = []; RECORDS = []; REMINDERS = []; ORDERS = []; TRENDS = {}; SERVER_CART = null;
  const selfMember = (me.members||[]).find(m=>m.is_self);
  if(selfMember && AUTH_TOKEN){
    FAMILY = (me.members||[]).map(m=>Object.assign({}, m, {color: accentFor(m.id)}));
    SERVER_CART = await api('/cart').catch(()=>null);
    const numericId = String(selfMember.id).replace(/^f/,'');
    const [records, vitals, reminders, orders] = await Promise.all([
      api('/members/'+numericId+'/records').catch(()=>({items:[]})),
      api('/members/'+numericId+'/vitals').catch(()=>({series:{}})),
      api('/members/'+numericId+'/reminders').catch(()=>({items:[]})),
      api('/orders').catch(()=>({items:[]})),
    ]);
    RECORDS = (records.items||[]).map(decorate);
    REMINDERS = (reminders.items||[]).map(r=>Object.assign({}, r, {color: accentFor(String(r.id))}));
    ORDERS = (orders.items||[]).filter(o=>!['DELIVERED','CANCELLED','REJECTED'].includes(o.status)).map(o=>({
      id:o.id, items:(o.items[0]?o.items[0].name:'Order') + (o.items.length>1?' + '+(o.items.length-1)+' more':''),
      status:o.status.replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase()),
      eta:'', prog: o.status==='DELIVERED'?100:(o.status==='OUT_FOR_DELIVERY'?75:35),
      color: accentFor(o.id),
    }));
    TRENDS = {};
    Object.keys(vitals.series||{}).forEach(key=>{
      const meta = TREND_META[key] || {label:key, good:'', color:'teal', dir:'down'};
      const series = vitals.series[key];
      TRENDS[key] = Object.assign({}, meta, {unit: series.unit, data: series.data});
    });
  }
}

/* Fetches full detail + server-computed substitutes for one product. */
function useMedDetail(sku){
  const [state,setState]=useState({loading:true, detail:null, subs:null, error:null});
  useEffect(()=>{
    let live=true;
    setState({loading:true, detail:null, subs:null, error:null});
    Promise.all([
      api('/catalog/products/'+encodeURIComponent(sku)),
      api('/catalog/products/'+encodeURIComponent(sku)+'/substitutes'),
    ]).then(([detail,subs])=>{ if(live) setState({loading:false, detail, subs, error:null}); })
      .catch(err=>{ if(live) setState({loading:false, detail:null, subs:null, error:err.message}); });
    return ()=>{ live=false; };
  },[sku]);
  return state;
}

/* SVG line chart for vital trends */
function TrendChart({data,color='teal',unit='',h=120}){
  const w=300, pad=24;
  const vals=data.map(d=>d.v), min=Math.min(...vals), max=Math.max(...vals);
  const rng=(max-min)||1;
  const X=i=> pad + (i/(data.length-1))*(w-pad*2);
  const Y=v=> (h-22) - ((v-min)/rng)*(h-44) + 6;
  const stroke = {teal:'#13a08a',rose:'#f43f6e',amber:'#f5a623',blue:'#3b82f6'}[color]||'#13a08a';
  const pts=data.map((d,i)=>[X(i),Y(d.v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const area=line+` L ${X(data.length-1)} ${h} L ${X(0)} ${h} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  return html`<svg viewBox=${`0 0 ${w} ${h}`} style=${{width:'100%',height:h}}>
    <defs><linearGradient id=${gid} x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color=${stroke} stop-opacity="0.22"/>
      <stop offset="100%" stop-color=${stroke} stop-opacity="0"/></linearGradient></defs>
    <path d=${area} fill=${`url(#${gid})`}/>
    <path d=${line} fill="none" stroke=${stroke} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>html`<g key=${i}>
       <circle cx=${p[0]} cy=${p[1]} r="4" fill="#fff" stroke=${stroke} stroke-width="2.5"/>
       <text x=${p[0]} y=${h-5} text-anchor="middle" font-size="10" fill="var(--faint)" font-family="var(--body)">${data[i].d}</text>
       ${i===data.length-1?html`<text x=${p[0]} y=${p[1]-12} text-anchor="middle" font-size="11" font-weight="700" fill=${stroke} font-family="var(--display)">${data[i].v}${unit}</text>`:null}
     </g>`)}
  </svg>`;
}

/* animated count-up ring */
function ScoreRing({score=82,size=148,stroke=12}){
  const [val,setVal]=useState(0);
  useEffect(()=>{ let raf,start; const dur=900;
    const tick=t=>{ if(!start)start=t; const p=Math.min((t-start)/dur,1);
      setVal(Math.round(score*(1-Math.pow(1-p,3)))); if(p<1)raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf);
  },[score]);
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c-(val/100)*c;
  return html`<div class="ring" style=${{width:size,height:size}}>
    <svg width=${size} height=${size}>
      <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="rgba(255,255,255,.18)" stroke-width=${stroke}/>
      <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="#fff" stroke-width=${stroke}
        stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${off} style=${{transition:'stroke-dashoffset .1s'}}/>
    </svg>
    <div class="ring-center">
      <div class="score">${val}</div>
      <div class="lbl">Health score</div>
    </div>
  </div>`;
}

/* Razorpay Standard Checkout. Resolves 'paid' only after the server has
   verified the signature; 'dismissed' if the customer closed the popup. */
let RZP_SCRIPT=null;
function loadRazorpay(){
  if(window.Razorpay) return Promise.resolve();
  if(!RZP_SCRIPT) RZP_SCRIPT=new Promise((ok,fail)=>{
    const tag=document.createElement('script');
    tag.src='https://checkout.razorpay.com/v1/checkout.js';
    tag.onload=ok; tag.onerror=()=>{ RZP_SCRIPT=null; fail(new Error("Couldn't load the payment page. Check your connection.")); };
    document.head.appendChild(tag);
  });
  return RZP_SCRIPT;
}
async function payOnline(orderId, p){
  await loadRazorpay();
  return new Promise((resolve,reject)=>{
    const rzp=new window.Razorpay({
      key:p.key_id, amount:p.amount, currency:p.currency, order_id:p.razorpay_order_id,
      name:p.name, description:p.description, theme:{color:'#0e7c6b'},
      handler: async (resp)=>{
        try{ await api('/orders/'+orderId+'/payment/verify',{method:'POST',body:resp}); resolve('paid'); }
        catch(e){ reject(e); }
      },
      modal:{ondismiss:()=>resolve('dismissed')},
    });
    rzp.on('payment.failed', r=>reject(new Error(r?.error?.description||'Payment failed. You can try again from your order.')));
    rzp.open();
  });
}

function Pharmacy(){
  const s=useStore();
  const [cat,setCat]=useState('All');
  const [cats,setCats]=useState(()=>['All',...new Set(MEDS.map(m=>m.cat))]);
  const [res,setRes]=useState({items:MEDS.slice(0,48), total:null, loading:false, error:null});

  useEffect(()=>{
    api('/catalog/categories')
      .then(r=>setCats(['All',...(r.items||[]).map(c=>c.name)]))
      .catch(()=>{});
  },[]);

  /* Search runs on the server. Filtering the 48 products loaded at boot
     meant almost every search of the 254k-product catalogue found nothing. */
  useEffect(()=>{
    let live=true;
    const q=(s.query||'').trim();
    setRes(r=>Object.assign({}, r, {loading:true, error:null}));
    const timer=setTimeout(()=>{
      const params=new URLSearchParams({size:'48'});
      if(q) params.set('q', q);
      if(cat!=='All') params.set('category', cat);
      api('/catalog/products?'+params.toString())
        .then(r=>{
          if(!live) return;
          const items=(r.items||[]).map(decorate);
          rememberMeds(items);
          setRes({items, total:r.total, loading:false, error:null});
        })
        .catch(e=>{ if(live) setRes({items:[], total:0, loading:false, error:e.message}); });
    }, q?300:0);
    return ()=>{ live=false; clearTimeout(timer); };
  },[s.query, cat]);

  const list=res.items;
  return html`<div class="page-enter">
    <div class="row between center wrap" style=${{gap:12,marginBottom:6}}>
      <div><div class="eyebrow">Online Pharmacy</div><h1 class="h-xl" style=${{marginTop:6}}>Medicines & wellness</h1>
        <p class="sub" style=${{marginTop:6}}>Search any medicine to see its composition, uses, side-effects and cheaper generic substitutes.</p></div>
      <button class="btn btn-outline" onClick=${()=>s.go('rxscan')}><${Icon} name="upload" size=17/> Upload prescription</button>
    </div>

    <div class="card card-pad" style=${{background:'linear-gradient(110deg,var(--mint),var(--teal-50))',border:'1px solid var(--teal-100)',marginTop:16}}>
      <div class="row center between wrap" style=${{gap:14}}>
        <div class="row center" style=${{gap:13}}>
          <div class="qa-ic" style=${{background:'#fff',color:'var(--green)'}}><${Icon} name="percent" size=24/></div>
          <div><div style=${{fontWeight:800,fontSize:16,fontFamily:'var(--display)'}}>Save up to 60% with generics</div>
          <div class="sub">Same salt, same effect — we show you the cheapest verified substitute for every brand.</div></div>
        </div>
        <${Tag} kind="green">Verified by pharmacists</${Tag}>
      </div>
    </div>

    <div class="scroll-x" style=${{marginTop:18}}>
      ${cats.map(c=>html`<button key=${c} class=${'chip'+(cat===c?' on':'')} onClick=${()=>setCat(c)}>${c}</button>`)}
    </div>

    ${res.total!=null && html`<p class="sub" style=${{marginTop:14}}>
      ${res.loading?'Searching…':(res.total>list.length
        ?`Showing ${list.length} of ${res.total.toLocaleString('en-IN')} medicines — refine your search to narrow it down.`
        :`${res.total.toLocaleString('en-IN')} medicine${res.total===1?'':'s'}`)}</p>`}

    <div class="med-grid" style=${{marginTop:18}}>
      ${list.length?list.map(m=>html`<${MedCard} key=${m.id} m=${m}/>`):html`<div class="empty" style=${{gridColumn:'1/-1'}}>
        <div class="empty-ic"><${Icon} name="search" size=30/></div>
        <div style=${{fontWeight:700}}>${res.loading?'Searching…':(res.error?'Search is unavailable':'No medicines found')}</div>
        <p class="sub">${res.error?res.error:'Try a different name or salt.'}</p></div>`}
    </div>
  </div>`;
}

function Consult({d,mode}){
  const s=useStore();
  const [msgs,setMsgs]=useState([
    {who:'them',t:`Hello! I'm ${d.name}. I've reviewed your profile. What brings you in today?`},
  ]);
  const [txt,setTxt]=useState('');
  const [typing,setTyping]=useState(false);
  const bodyRef=useRef();
  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop=bodyRef.current.scrollHeight; },[msgs,typing]);
  const reply=(userText)=>{
    setTyping(true);
    const t=userText.toLowerCase();
    let r="Thank you for sharing that. How long have you had these symptoms, and is anything making them better or worse?";
    if(/fever|temperature/.test(t)) r="Noted — fever can have many causes. Any cough, body ache or sore throat? I'd suggest paracetamol 500mg and staying hydrated; if it crosses 102°F or lasts beyond 3 days, we'll run a quick blood test.";
    else if(/cough|cold|throat/.test(t)) r="Sounds like an upper respiratory infection. Is the cough dry or with phlegm? Steam inhalation and warm fluids help. I'll send an e-prescription if needed.";
    else if(/acid|gas|stomach|reflux/.test(t)) r="That points to acidity/reflux. Try avoiding spicy and late meals. I can prescribe Pan-D before breakfast for 5 days — shall I add it to your prescription?";
    else if(/headache|migrain/.test(t)) r="Got it. Is it one-sided or all over, and any sensitivity to light? Let's start with hydration and rest; I'll note a mild analgesic.";
    else if(/sugar|diabet|hba1c/.test(t)) r="Good that you're tracking it. Your last HbA1c was 6.1% which is well controlled. Continue Metformin and we'll recheck in 3 months.";
    else if(/thank|ok|okay|got it/.test(t)) r="You're welcome. I'm sending your e-prescription now. Take care, and reach out anytime during your free 7-day follow-up.";
    setTimeout(()=>{ setTyping(false); setMsgs(m=>[...m,{who:'them',t:r}]); }, 1200+Math.random()*600);
  };
  const send=()=>{ const v=txt.trim(); if(!v)return; setMsgs(m=>[...m,{who:'me',t:v}]); setTxt(''); reply(v); };
  return html`<div class="page-enter">
    <button class="chip" onClick=${()=>s.go('doctors')} style=${{marginBottom:16}}><${Icon} name="chevL" size=16/> End consult</button>
    <div class="grid" style=${{gridTemplateColumns:'1fr 320px',alignItems:'start'}}>

            <span class="sub" style=${{fontSize:12}}>${mode==='video'?'Video consult · connected':mode==='audio'?'Audio consult · connected':'Online now'}</span></div></div>
          ${mode!=='chat'?html`<button class="icon-btn" style=${{width:40,height:40}} onClick=${()=>s.toast(mode+' call is a demo')}><${Icon} name=${mode==='video'?'video':'phone'} size=18/></button>`:null}
          <button class="icon-btn" style=${{width:40,height:40}} onClick=${()=>s.toast('Call ended')}><${Icon} name="x" size=18/></button>
        </div>
        <div class="chat-body" ref=${bodyRef}>
          ${mode==='video'?html`<div style=${{background:'linear-gradient(135deg,#0a4d42,#0e7c6b)',borderRadius:18,height:160,display:'grid',placeItems:'center',marginBottom:6,position:'relative',overflow:'hidden'}}>
            <${Avatar} name=${d.name} color=${d.color} size=64 radius=20/>
            <div style=${{position:'absolute',bottom:10,left:10,color:'#fff',fontSize:12,fontWeight:600,background:'rgba(0,0,0,.3)',padding:'4px 10px',borderRadius:8}}>${d.name.split(' ')[1]} · live</div>
            <div style=${{position:'absolute',bottom:10,right:10,width:54,height:70,borderRadius:10,background:'rgba(255,255,255,.18)',border:'1.5px solid rgba(255,255,255,.4)',display:'grid',placeItems:'center',color:'#fff',fontSize:10}}>You</div>
          </div>`:null}
          ${msgs.map((m,i)=>html`<div key=${i} class=${'bubble '+(m.who==='me'?'me':'them')}>${m.t}</div>`)}
          ${typing?html`<div class="bubble them typing"><span/><span/><span/></div>`:null}
        </div>
        <div class="chat-input">
          <button class="icon-btn" style=${{width:42,height:42}} onClick=${()=>s.toast('Attach a report')}><${Icon} name="upload" size=18/></button>
          <input placeholder="Describe your symptoms…" value=${txt}

          <button class="btn btn-primary" style=${{padding:'11px 16px'}} onClick=${send}><${Icon} name="send" size=18/></button>

  ]);
  const [txt,setTxt]=useState('');

  const [escalate,setEscalate]=useState(null);
  const bodyRef=useRef();
  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop=bodyRef.current.scrollHeight; },[msgs,typing,escalate]);

  /* All symptom screening happens server-side. The client renders whatever
     the API returns and never composes health advice of its own. */
  const reply = async (userText)=>{
    setTyping(true);
    try{
      const res = await api('/ai/triage', {method:'POST', body:{message:userText}});
      setTyping(false);
      setMsgs(m=>[...m,{who:'them', t:res.message}]);
      if(res.level==='CRISIS' || res.level==='EMERGENCY'){
        setEscalate({urgent:true, level:res.level, actions:res.actions||[]});
      } else if(res.actions && res.actions.length){
        setEscalate({actions:res.actions});
      }
    }catch(err){
      setTyping(false);
      setMsgs(m=>[...m,{who:'them', t:"I couldn't reach the health service just now. If this feels urgent, please call 108 or see a doctor rather than waiting."}]);
    }
  };
  const send=(preset)=>{ const v=(preset||txt).trim(); if(!v)return; setMsgs(m=>[...m,{who:'me',t:v}]); setTxt(''); setEscalate(null); reply(v); };

          <div style=${{flex:1}}><div style=${{fontWeight:700,fontSize:14.5}}>Nirog AI</div>
            <div class="row center" style=${{gap:5}}><span class="doc-on" style=${{position:'static',width:8,height:8,border:'none'}}/>

          ${typing?html`<div class="bubble them typing"><span/><span/><span/></div>`:null}
          ${escalate&&escalate.urgent?html`<div class="card" style=${{marginTop:10,padding:16,border:'1.5px solid var(--coral)',background:'var(--coral-soft)'}}>
            <div class="row center" style=${{gap:9,marginBottom:9}}><${Icon} name="ambulance" size=20 style=${{color:'var(--coral-dark)'}}/>

/* ============================== CART DRAWER ============================== */
function CartDrawer(){
  const s=useStore();
  const c=s.serverCart;
  const items=c?.items||[];
  const count=items.reduce((a,i)=>a+i.qty,0);
  const find=i=>MEDS.find(x=>x.id===i.id)||decorate(i);
  return html`<div>
    <div class="scrim" onClick=${()=>s.setCartOpen(false)}/>
    <div class="drawer">
      <div class="drawer-head">
        <div class="row center" style=${{gap:10}}><${Icon} name="cart" size=20 style=${{color:'var(--teal-700)'}}/><b style=${{fontSize:16}}>Your cart</b>
          ${count?html`<span class="tag tag-teal">${count} items</span>`:null}</div>
        <button class="icon-btn" style=${{width:38,height:38}} onClick=${()=>s.setCartOpen(false)}><${Icon} name="x" size=18/></button>
      </div>
      <div class="drawer-body">
        ${!s.user?html`<div class="empty">
          <div style=${{fontWeight:700,fontSize:16}}>Log in to see your cart</div>
          <button class="btn btn-primary" style=${{marginTop:14}} onClick=${()=>s.requireLogin('Log in to see your cart.')}>Log in</button></div>`
        :items.length===0?html`<div class="empty">
          <div class="empty-ic"><${Icon} name="cart" size=34 style=${{color:'var(--teal-400)'}}/></div>
          <div style=${{fontWeight:700,fontSize:16,marginTop:4}}>Your cart is empty</div>
          <div class="sub" style=${{marginBottom:16}}>Add medicines and save with generics</div>
          <button class="btn btn-primary" onClick=${()=>{s.setCartOpen(false);s.go('pharmacy');}}>Browse pharmacy</button>
        </div>`:html`<div>
          ${items.map(i=>html`<div key=${i.id} class="cart-item">
            <div class="cart-thumb"><${Icon} name=${i.form==='Syrup'?'drop':'pill'} size=24/></div>
            <div style=${{flex:1,minWidth:0}}>
              <div style=${{fontWeight:700,fontSize:14}}>${i.name} ${i.policy.requires_prescription?html`<${Tag} kind="coral">Rx</${Tag}>`:null}</div>
              <div class="sub" style=${{fontSize:12}}>${i.pack}</div>
              ${!i.policy.allowed?html`<div class="sub" style=${{fontSize:12,color:'var(--coral-dark)'}}>${i.policy.message}</div>`:null}
              <div class="row between center" style=${{marginTop:8}}>
                <div><b>${inr(i.line_total)}</b> ${i.mrp>i.price?html`<span class="was" style=${{fontSize:12}}>${inr(i.mrp*i.qty)}</span>`:null}</div>
                <div class="stepper">
                  <button onClick=${()=>s.setQty(find(i),i.qty-1)}><${Icon} name="minus" size=15/></button>
                  <span>${i.qty}</span>
                  <button onClick=${()=>s.setQty(find(i),i.qty+1)}><${Icon} name="plus" size=15/></button>
                </div>
              </div>
            </div>
          </div>`)}
          ${c.you_save>0?html`<div class="card card-pad" style=${{background:'var(--green-soft)',marginTop:4}}>
            <div class="row center" style=${{gap:9}}><${Icon} name="percent" size=18 style=${{color:'var(--green)'}}/>
              <span style=${{fontWeight:700,color:'var(--green-dark,#0a7d54)',fontSize:13.5}}>You're saving ${inr(c.you_save)} on this order</span></div>
          </div>`:null}
          ${c.requires_prescription?html`<div class="card card-pad" style=${{background:'var(--amber-soft)',marginTop:10,fontSize:13}}>
            Prescription (Rx) medicines need a valid prescription, checked by our pharmacist before dispatch.</div>`:null}
          <div style=${{marginTop:18}}>
            <div class="row between" style=${{fontSize:13.5,marginBottom:8}}><span class="sub">Item total (MRP)</span><span>${inr(c.mrp_total)}</span></div>
            <div class="row between" style=${{fontSize:13.5,marginBottom:8}}><span class="sub">Discount</span><span style=${{color:'var(--green)'}}>− ${inr(c.you_save)}</span></div>
            <div class="row between" style=${{fontSize:13.5,marginBottom:8}}><span class="sub">Delivery</span><span>${c.delivery===0?'FREE':inr(c.delivery)}</span></div>
          </div>
        </div>`}
      </div>
      ${s.user&&items.length?html`<div class="drawer-foot">
        <div class="row between center" style=${{marginBottom:12}}><span style=${{fontWeight:700,fontSize:16}}>To pay</span>
          <span style=${{fontFamily:'var(--display)',fontWeight:800,fontSize:22}}>${inr(c.total)}</span></div>
        <button class="btn btn-coral btn-block" disabled=${!c.checkout_allowed} onClick=${()=>s.checkout()}>
          <${Icon} name="shieldcheck" size=18/> Proceed to checkout</button>
      </div>`:null}
    </div>
  </div>`;
}

/* ============================== LAB BOOKING MODAL ============================== */
function LabModal({item,close}){
  const s=useStore();
  const [slots,setSlots]=useState(null);
  const [slot,setSlot]=useState(null);
  const [addresses,setAddresses]=useState(null);
  const [addr,setAddr]=useState(null);
  const [adding,setAdding]=useState(false);
  const [member,setMember]=useState((FAMILY.find(f=>f.is_self)||FAMILY[0]||{}).id);
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState(null);
  const [done,setDone]=useState(null);

  useEffect(()=>{
    if(!s.user) return;
    api('/lab-slots').then(r=>{ setSlots(r.items); setSlot((r.items.find(x=>x.available)||{}).slot); }).catch(e=>setError(e.message));
    api('/addresses').then(r=>{ setAddresses(r.items); setAddr((r.items.find(a=>a.is_default)||r.items[0]||{}).id);
      if(!r.items.length) setAdding(true); }).catch(()=>setAddresses([]));
  },[]);

  const book=async()=>{
    setBusy(true); setError(null);
    try{ setDone(await api('/lab-bookings',{method:'POST',body:{test_id:item.id,address_id:addr,member_id:member,slot}})); }
    catch(e){ setError(e.message); if(e.code==='slot_full'||e.code==='slot_unavailable') api('/lab-slots').then(r=>setSlots(r.items)); }
    finally{ setBusy(false); }
  };

  const days={};
  (slots||[]).forEach(x=>{ const d=x.label.split(',')[0]; (days[d]=days[d]||[]).push(x); });

  return html`<div class="modal">
    <div class="scrim" onClick=${close}/>
    <div class="modal-card" style=${{position:'relative',zIndex:1,maxHeight:'90vh',overflow:'auto'}}>
      <div class="drawer-head">
        <div class="row center" style=${{gap:10}}><div class="qa-ic" style=${{width:38,height:38,background:soft.violet,color:C.violet}}><${Icon} name="flask" size=19/></div>
          <b>Book home collection</b></div>
        <button class="icon-btn" style=${{width:36,height:36}} onClick=${close}><${Icon} name="x" size=17/></button>
      </div>
      <div style=${{padding:'20px 22px'}}>
        <div class="card card-pad" style=${{background:'var(--mint)',marginBottom:18}}>
          <div style=${{fontWeight:700}}>${item.name}</div>
          <div class="row between center" style=${{marginTop:6}}>
            <span class="sub">${item.price?inr(item.price):'Price on confirmation'} · pay at collection</span>
            ${item.fasting?html`<span class="tag tag-amber">Fasting needed</span>`:null}</div>
        </div>
        ${!s.user?html`<div style=${{textAlign:'center'}}>
            <p class="sub">Log in to book a home sample collection.</p>
            <button class="btn btn-primary" style=${{marginTop:12}} onClick=${()=>{close();s.requireLogin('Log in to book a lab test.');}}>Log in</button></div>`
        :done?html`<div style=${{textAlign:'center',padding:'10px 0'}}>
          <div class="empty-ic" style=${{background:'var(--green-soft)',margin:'0 auto'}}><${Icon} name="check" size=34 style=${{color:'var(--green)'}}/></div>
          <div style=${{fontWeight:800,fontSize:18,marginTop:14,fontFamily:'var(--display)'}}>Booking received</div>
          <div class="sub" style=${{marginTop:6}}>${done.test.name} for ${done.patient}<br/>${done.slot_label} · Ref ${done.reference}</div>
          <p class="sub" style=${{marginTop:10,fontSize:13}}>The lab will confirm your slot. ${item.fasting?'Please fast for 10–12 hours before collection. ':''}Pay at collection.</p>
          <button class="btn btn-primary btn-block" style=${{marginTop:18}} onClick=${()=>{close();s.openBookings();}}>View my lab tests</button>
        </div>`
        :html`<div>
          ${FAMILY.length>1?html`<div class="lbl" style=${{marginBottom:8}}>Who is the test for?</div>
            <div class="row wrap" style=${{gap:8,marginBottom:16}}>
              ${FAMILY.map(f=>html`<button key=${f.id} class=${'chip'+(member===f.id?' on':'')} onClick=${()=>setMember(f.id)}>${f.is_self?'Myself':f.name}</button>`)}</div>`:null}
          <div class="lbl" style=${{marginBottom:8}}>Collection slot</div>
          ${slots===null?html`<div class="sub">Loading slots…</div>`:null}
          ${Object.entries(days).map(([day,list])=>html`<div key=${day} style=${{marginBottom:10}}>
            <div class="sub" style=${{fontSize:12.5,fontWeight:700,marginBottom:6}}>${day}</div>
            <div class="row wrap" style=${{gap:8}}>
              ${list.map(x=>html`<button key=${x.slot} class=${'slot'+(slot===x.slot?' on':'')} disabled=${!x.available}
                style=${{opacity:x.available?1:.45}} onClick=${()=>setSlot(x.slot)}>${x.label.split(', ')[1]}${x.available?'':' · full'}</button>`)}
            </div></div>`)}
          <div class="lbl" style=${{margin:'14px 0 6px'}}>Collection address</div>
          ${(addresses||[]).map(a=>html`<label key=${a.id} class=${'card card-pad addr'+(addr===a.id?' on':'')} style=${{marginTop:8}}>
            <input type="radio" name="labaddr" checked=${addr===a.id} onChange=${()=>setAddr(a.id)}/>
            <div class="sub" style=${{fontSize:13.5}}>${a.text}</div></label>`)}
          ${adding?html`<${AddressForm} onCancel=${addresses&&addresses.length?()=>setAdding(false):null}
              onSaved=${a=>{setAddresses([a,...(addresses||[])]);setAddr(a.id);setAdding(false);}}/>`
            :html`<button class="btn btn-ghost btn-sm" style=${{marginTop:8}} onClick=${()=>setAdding(true)}><${Icon} name="plus" size=14/> Add address</button>`}
          ${error?html`<div class="card card-pad" style=${{marginTop:12,background:'var(--coral-soft)',fontSize:13.5}}>${error}</div>`:null}
          <button class="btn btn-primary btn-block" style=${{marginTop:18}} disabled=${busy||!slot||!addr} onClick=${book}>
            ${busy?'Booking…':'Book collection'}</button>
        </div>`}
      </div>
    </div>
  </div>`;
}

/* ============================== TOASTS ============================== */
function Toasts({list}){
  return html`<div class="toast-wrap">
    ${list.map(t=>html`<div key=${t.id} class="toast"><${Icon} name="check" size=16 style=${{color:'var(--teal-300)'}}/> ${t.msg}</div>`)}
  </div>`;
}

/* ============================== APP ROOT ============================== */
function App(){
  const [booted,setBooted]=useState(false);
  const [bootError,setBootError]=useState(null);
  useEffect(()=>{ boot().then(()=>{ setUser(USER); setServerCart(SERVER_CART); setBooted(true); })
    .catch(e=>setBootError(e.message)); },[]);
  useEffect(()=>{
    const onLogout=()=>{ USER=null; setUser(null); setServerCart(null); };
    window.addEventListener('nirog-logout', onLogout);
    return ()=>window.removeEventListener('nirog-logout', onLogout);
  },[]);
  const [route,setRoute]=useState('home');
  const [selMed,setSelMed]=useState(null);
  const [selDoc,setSelDoc]=useState(null);
  const [consult,setConsult]=useState(null);
  const [serverCart,setServerCart]=useState(null);
  const [user,setUser]=useState(null);
  const [loginReason,setLoginReason]=useState(null);
  const [afterLogin,setAfterLogin]=useState(null);
  const [orderId,setOrderId]=useState(null);
  const [ordersTab,setOrdersTab]=useState('medicines');
  const [,setTick]=useState(0);   // re-render after the module-level stores change
  const [activeFam,setActiveFam]=useState('f1');
  const [query,setQuery]=useState('');
  const [cartOpen,setCartOpen]=useState(false);
  const [labItem,setLabItem]=useState(null);
  const [toasts,setToasts]=useState([]);
  /* Quantity per product id, derived from the server cart. */
  const cart = {};
  (serverCart?.items||[]).forEach(i=>{ cart[i.id]=i.qty; });
  const mainRef=useRef();

  const scrollTop=()=>{ if(mainRef.current) mainRef.current.scrollTo({top:0,behavior:'smooth'}); window.scrollTo({top:0,behavior:'smooth'}); };
  const toast=(msg)=>{ const id=Date.now()+Math.random(); setToasts(t=>[...t,{id,msg}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600); };

  const requireLogin=(reason)=>{
    setLoginReason(reason||null); setAfterLogin(route==='login'?'home':route);
    setSelMed(null); setSelDoc(null); setConsult(null); setCartOpen(false);
    setRoute('login'); scrollTop();
  };
  const setQty=async(m,q)=>{
    if(!user){ requireLogin('Log in to add medicines to your cart.'); return; }
    const wasNew=!cart[m.id];
    try{
      const c=await api('/cart/items/'+encodeURIComponent(m.id),{method:'PUT',body:{quantity:Math.max(0,q)}});
      setServerCart(c);
      if(q>0 && wasNew) toast(m.name+' added to cart');
    }catch(err){ toast(err.message || 'Could not update your cart'); }
  };

  const store={
    route, query, cart, activeFam, cartOpen,
    go:(r)=>{ setSelMed(null); setSelDoc(null); setConsult(null); setOrderId(null); setRoute(r); if(r!=='pharmacy') setQuery(''); scrollTop(); },
    setQuery,
    openMed:(m)=>{ setSelMed(m); scrollTop(); },
    openDoc:(d)=>{ setSelDoc(d); scrollTop(); },
    startConsult:(d,mode)=>{ setConsult({d,mode}); setSelDoc(null); scrollTop(); },
    bookLab:(item)=>{ setLabItem(item); },
    setActiveFam:(id)=>setActiveFam(id),
    setCartOpen,
    /* Server-backed. Prescription and quantity rules are enforced by the
       API, so a rejected change is surfaced rather than silently allowed. */
    setQty: (m,q)=>setQty(m,q),
    addToCart: (m,q=1)=>{ rememberMeds([decorate(m)]); return setQty(m,(cart[m.id]||0)+q); },
    serverCart, user, loginReason, orderId,
    requireLogin:(reason)=>requireLogin(reason),
    signIn: async (token)=>{
      setAuthToken(token);
      await boot();
      setUser(USER); setServerCart(SERVER_CART); setTick(t=>t+1);
      toast('Welcome, '+(USER?.first_name||'back'));
      const next=afterLogin||'home'; setAfterLogin(null); setLoginReason(null);
      setRoute(next); scrollTop();
    },
    signOut: async ()=>{
      setAuthToken(null); await boot();
      setUser(null); setServerCart(null); setTick(t=>t+1); setRoute('home'); toast('Logged out');
    },
    refreshAccount: async ()=>{ await boot(); setServerCart(SERVER_CART); setTick(t=>t+1); },
    openOrder:(id)=>{ setOrderId(id); setOrdersTab('medicines'); setRoute('orders'); scrollTop(); },
    openBookings:()=>{ setOrderId(null); setOrdersTab('labs'); setRoute('orders'); scrollTop(); },
    ordersTab,
    checkout:()=>{ setCartOpen(false); setRoute('checkout'); scrollTop(); },
    toast,
  };

  if(bootError) return html`<div style=${{padding:'60px 24px',maxWidth:560,margin:'0 auto',fontFamily:'var(--body)'}}>
    <h1 class="h-lg">Can't reach the Nirog API</h1>
    <p class="sub" style=${{marginTop:10,lineHeight:1.6}}>${bootError}</p>
    <p class="sub" style=${{marginTop:14,lineHeight:1.6}}>Start the backend with <code>python run.py</code> in <code>backend/</code>, then reload. If it is running on another host, set <code>window.NIROG_API_BASE</code> before this script.</p>
  </div>`;
  if(!booted) return html`<div style=${{display:'grid',placeItems:'center',minHeight:'100vh',fontFamily:'var(--body)',color:'var(--muted)'}}>Loading Nirog…</div>`;

  const NEEDS_LOGIN={checkout:'Log in to check out.', orders:'Log in to see your orders.',
    profile:'Log in to see your profile.', records:'Log in to see your health records.'};
  let screen;
  if(!user && NEEDS_LOGIN[route] && !selMed && !selDoc && !consult)
    screen=html`<${Login}/>`;
  else if(consult) screen=html`<${Consult} d=${consult.d} mode=${consult.mode}/>`;
  else if(selDoc) screen=html`<${DocProfile} d=${selDoc}/>`;
  else if(selMed) screen=html`<${MedDetail} m=${selMed}/>`;
  else switch(route){
    case 'pharmacy': screen=html`<${Pharmacy}/>`; break;
    case 'rxscan': screen=html`<${RxScan}/>`; break;
    case 'login': screen=html`<${Login}/>`; break;
    case 'checkout': screen=html`<${Checkout}/>`; break;
    case 'orders': screen=html`<${Orders} key=${ordersTab+(orderId||'')}/>`; break;
    case 'doctors': screen=html`<${Doctors}/>`; break;
    case 'labs': screen=html`<${Labs}/>`; break;
    case 'ai': screen=html`<${AIAssistant}/>`; break;
    case 'records': screen=html`<${Records}/>`; break;
    case 'preventive': screen=html`<${Preventive}/>`; break;
    case 'emergency': screen=html`<${Emergency}/>`; break;
    case 'insurance': screen=html`<${Insurance}/>`; break;
    case 'profile': screen=html`<${Profile}/>`; break;
    case 'homecare': case 'chronic': case 'maternity': case 'mental': case 'fitness': case 'senior':
      screen=html`<${ModulePage} mod=${route}/>`; break;
    default: screen=html`<${Home}/>`;
  }

  return html`<${Store.Provider} value=${store}>
    <div class="app">
      <${Sidebar}/>
      <div class="main" ref=${mainRef}>
        <${Topbar}/>
        <div class="content">${screen}</div>
      </div>
      <${BottomNav}/>
      ${cartOpen?html`<${CartDrawer}/>`:null}
      ${labItem?html`<${LabModal} item=${labItem} close=${()=>setLabItem(null)}/>`:null}
      <${Toasts} list=${toasts}/>
    </div>
  </${Store.Provider}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);


</script>
</body>
</html>
