# Render Blueprint — New > Blueprint > pick this repo.
# Creates the Flask API and a PostgreSQL database, and wires them together.
services:
  - type: web
    name: nirog-api
    runtime: python
    plan: free
    rootDir: backend
    # Only backend changes redeploy the API; frontend-only commits go to Netlify.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    buildCommand: pip install -r requirements.txt
    # Render fails a deploy that has not opened a port within ~5 minutes, so
    # tables + seed run first (seconds), then the 254k-row CSV import runs in
    # the background while gunicorn serves. The import is idempotent and
    # resumes if the instance restarts part-way; once complete it is a no-op.
    startCommand: python bootstrap_db.py --skip-import && (python bootstrap_db.py &) && exec gunicorn 'app:create_app()' --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Stream bootstrap/import progress to the Render log as it happens.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Staff key for /api/admin (medicine content uploads). Render generates
      # it; read it from the dashboard and keep it private.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nirog-db
          property: connectionString
      # Your Netlify URL, e.g. https://nirog.netlify.app (comma-separate several)
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_RX_DISPATCH
        value: "false"
      - key: PHARMACIST_VERIFICATION_REQUIRED
        value: "true"
      - key: ENABLE_TELECONSULT
        value: "false"
      - key: ENABLE_LIVE_PAYMENTS
        value: "false"
      # Razorpay (dashboard > Account & Settings > API keys / Webhooks).
      # Test keys (rzp_test_) work as-is; live keys also need
      # ENABLE_LIVE_PAYMENTS=true. Set these in the Render dashboard.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ENABLE_AI_TRIAGE
        value: "true"
      - key: AI_PROVIDER
        value: none
      # Prescription reader. Set the key in the Render dashboard, never here.
      - key: GEMINI_API_KEY
        sync: false
      - key: PRESCRIPTION_READER_MODEL
        value: gemini-3.8-flash
      - key: PRESCRIPTION_READER_THINKING
        value: low
      - key: PRESCRIPTION_READS_PER_DAY
        value: "20"
      # -------------------- vendor integrations (new) --------------------
      # DrugSetu
      - key: DRUGSETU_API_KEY
        sync: false
      - key: DRUGSETU_PLAN
        value: trial
      - key: DRUGSETU_USE_MOCK
        value: "true"
      # Shiprocket
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        value: ""
      - key: SHIPROCKET_PICKUP_PINCODE
        value: ""
      - key: SHIPROCKET_WEBHOOK_TOKEN
        value: ""
      # PhonePe
      - key: PHONEPE_MERCHANT_ID
        sync: false
      - key: PHONEPE_SALT_KEY
        sync: false
      - key: PHONEPE_SALT_INDEX
        value: "1"
      - key: PHONEPE_ENV
        value: sandbox
      # MSG91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        value: ""
      - key: MSG91_SENDER_ID
        value: ""

databases:
  - name: nirog-db
    plan: free
    databaseName: nirog
    user: nirog
